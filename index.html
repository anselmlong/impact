<style>
:root{
  --paper:#f6f4ef; --card:#fffdf8; --ink:#16181a; --muted:#6b6f73; --faint:#a9a59c; --rule:#e2ded4;
  --accent:#0f6e4f; --accent-soft:#d9ebe3; --warn:#b5541c; --warn-soft:#f5e3d6;
  --display:"Archivo",system-ui,sans-serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{margin:0}
main{max-width:1040px;margin:0 auto;padding:48px 24px 80px}
a{color:inherit;text-decoration-color:var(--faint);text-underline-offset:2px}
a:hover{text-decoration-color:var(--accent);color:var(--accent)}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(40px,7vw,68px)/.95 var(--display);font-stretch:70%;letter-spacing:-.01em;margin:14px 0 10px}
h2{font:700 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 18px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h2 small{font:400 13px var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
section{margin-top:64px}
.ref{font:500 10.5px var(--mono);color:var(--faint);text-decoration:none;margin-left:4px;vertical-align:1px}
.ref:hover{color:var(--accent)}

.top{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:end}
.role{color:var(--muted);margin:0}
.tenure svg{width:100%;height:auto;display:block}
.tenure .cap{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted);margin-top:6px}

.stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink)}
.stat{padding:16px 16px 18px 0;border-right:1px solid var(--rule);margin-right:16px}
.stat:last-child{border-right:0;margin-right:0}
.stat .k{font:500 12px var(--sans);color:var(--muted);min-height:2.6em}
.stat .v{font:700 44px/1 var(--display);font-stretch:75%;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stat .d{font:12px var(--mono);color:var(--muted);min-height:1.4em}
.stat .d.up{color:var(--accent)} .stat .d.down{color:var(--warn)}
.stat svg{display:block;width:100%;height:24px;margin-top:10px;overflow:visible}
.stat .cmp{font:11.5px/1.4 var(--mono);color:var(--muted);margin-top:4px}

.chart{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:16px 16px 10px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;font:12px var(--mono);color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.proj{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:96px 1fr 210px 150px;gap:20px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:start}
.pill{display:inline-block;font:500 11px/1 var(--mono);padding:5px 7px;border-radius:3px;white-space:nowrap}
.pill.shipped,.pill.resolved{background:var(--accent-soft);color:var(--accent)}
.pill.review{background:#e6e8f0;color:#3c4a78}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.spotted{background:#ece9e1;color:#5c584f}
.when{font:12px var(--mono);color:var(--muted);margin-top:6px}
.name{font:600 16px/1.3 var(--sans)}
.name .key{font:12px var(--mono);color:var(--muted);font-weight:400;margin-left:6px}
.what{color:var(--muted);margin-top:2px}
.cav{font-size:13px;color:var(--warn);margin-top:6px}
.cav::before{content:"△ ";font-size:11px}
.proof .p{font:700 26px/1 var(--display);font-stretch:75%}
.proof .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.prs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.prs a{font:12px var(--mono);border:1px solid var(--rule);background:var(--card);padding:2px 6px;border-radius:3px;text-decoration:none}

.usage{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.usage .t{font:600 14px var(--sans)} .usage .u{font:12px var(--mono);color:var(--muted);margin-bottom:8px}

.kudos{display:grid;grid-template-columns:repeat(2,1fr);gap:0 32px;border-top:2px solid var(--ink)}
.kudo{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:160px 1fr;gap:12px}
.kudo .m{font:12px/1.4 var(--mono);color:var(--muted)} .kudo .m b{display:block;color:var(--ink);font-weight:500}

.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
ul.plain{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
ul.plain li{padding:11px 0 11px 26px;border-bottom:1px solid var(--rule);position:relative}
ul.plain li::before{position:absolute;left:2px;top:11px;font:13px var(--mono)}
ul.weak li::before{content:"△";color:var(--warn)}
ul.next li::before{content:"○";color:var(--muted)}
ul.next li.done::before{content:"●";color:var(--accent)}
ul.next li.done{color:var(--muted);text-decoration:line-through}

details{border-top:2px solid var(--ink)}
summary{cursor:pointer;padding:14px 0;font:600 14px var(--sans);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--muted);font-family:var(--mono)}
details[open] summary::after{content:" −"}
table{border-collapse:collapse;width:100%;font-size:13px}
td{border-top:1px solid var(--rule);padding:9px 10px 9px 0;vertical-align:top}
td:first-child{font:500 12px var(--mono);color:var(--muted);width:44px}
td:nth-child(2){width:36%}
td .k{display:block;color:var(--faint);font-size:12px}
tr:target td{background:var(--accent-soft)}
.cov{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 20px}
.cov div{font-size:13px;color:var(--muted)} .cov b{display:block;color:var(--ink);font-weight:600}
.cov .lvl{font:11px var(--mono);margin-left:6px;font-weight:400} .cov .ok{color:var(--accent)} .cov .part,.cov .bad{color:var(--warn)}
footer{margin-top:48px;font-size:12.5px;color:var(--muted)}

@media (max-width:860px){
  .top{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)} .stat{border-right:0;margin-right:16px;border-bottom:1px solid var(--rule)}
  .row{grid-template-columns:1fr;gap:8px} .prs{justify-content:flex-start}
  .usage,.kudos,.two,.cov{grid-template-columns:1fr}
  .tl .scroll{overflow-x:auto} .tl svg{min-width:720px}
}
</style>
</head>

hows": "Root cause: two racing setData writes to Mapbox about 9 ms apart. His repro went from 8 of 8 runs with stale stacks to 0 of 8. Self-reported. Merged 30 Oct."}, {"ref": "E23", "source": "Notion journals <a href=\"https://app.notion.com/p/3fe77dbba78880df8da7edde1c62fdfd\">Friday 23 Oct</a>, <a href=\"https://app.notion.com/p/40877dbba788804490f2d0b06dc17113\">Thursday 29 Oct</a> and <a href=\"https://app.notion.com/p/40e77dbba7888063b649cdff9cb9a028\">Thursday 5 Nov</a>; Slack #maps-linear, 5 Nov", "shows": "On 23 Oct he handed the ingestion flow to a teammate to explore. On 29 Oct, prototyping the ingestion redesign was still on his to-do list. On 5 Nov MAPS-471 was updated with him as assignee, and the project sync targeted end of November."}, {"ref": "E24", "source": "<a href=\"https://github.com/opengovsg/maps/pull/958\">PR #958</a>; <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1793696993649649\">Slack #maps, 3 Nov</a>", "shows": "Marker list fixed for long names, badges, distances and counts (MAPS-673), found with his /break-ui stress test. The designer gave her OK on 2 Nov and the manager approved on 3 Nov. Merged 3 Nov."}, {"ref": "E25", "source": "Slack #evitan, 3 Nov (PostHog error-tracking bot); <a href=\"https://github.com/opengovsg/maps/pull/922\">PR #922</a> diff; PostHog project 189562", "shows": "TypeError on Chrome 109 when clicking a stacked-marker bubble: the tracking calls Array.prototype.toSorted, added in #922. 1 event on 3 Nov, then 2 more from one person on 18 Nov: 3 events from 2 people. No fix PR exists."}, {"ref": "E26", "source": "<a href=\"https://app.notion.com/p/40c77dbba7888047a2a5dfd6fe925f17\">Notion: Sidebar Enhancements</a>, <a href=\"https://app.notion.com/p/40e77dbba78880aa92c2ecb71a54cdef\">Guerrilla UT, Sidebar</a>; <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1793693955746989\">Slack #maps, 3 Nov</a>", "shows": "On the 29 busiest public maps, median scroll e. A second shout-out that day was shared three ways and is not counted."}, {"ref": "E30", "source": "<a href=\"https://app.notion.com/p/41077dbba78880a6b94cf67c83838be8\">Notion: Search Code Review, 6 Nov</a>; Notion journal <a href=\"https://app.notion.com/p/40e77dbba7888063b649cdff9cb9a028\">Thursday 5 Nov</a>", "shows": "Code review of #912 with his manager. Issues raised: no timeout on OneMap calls; re-ranking needs a written rationale. Release moved from 10 Nov to 12 Nov. The manager approved #912 on GitHub on 12 Nov and it merged that day; his journal ticks \"Resolve Sid comments\". How the two points were resolved is not recorded."}, {"ref": "E31", "source": "<a href=\"https://github.com/opengovsg/maps/pull/912\">PR #912</a>, merged 12 Nov; <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794464498639719?thread_ts=1793171214.513399\">Slack #maps, 12 Nov</a>; PostHog project 189562", "shows": "Smarter Search merged after manager approval and went out in release 2af8bb7 the same day. search_suggestion_selected first fired 12 Nov 17:36 SGT: 1,135 picks by 732 people on 49 maps to 20 Nov; 1,005 by 638 people on 47 maps in the first full week, 13\u201319 Nov; team excluded. search_performed is not comparable across the launch: #912 changed what it counts from 12 Nov, and part of an earlier drop on 5\u20136 Nov came from one map that stopped sending events (cause not in the data). Distinct searchers a day stayed roughly flat."}, {"ref": "E32", "source": "<a href=\"https://github.com/opengovsg/maps/pull/936\">PR #936</a>, <a href=\"https://github.com/opengovsg/maps/pull/992\">#992</a>, <a href=\"https://github.com/opengovsg/maps/pull/966\">#966</a>, <a href=\"https://github.com/opengovsg/maps/pull/967\">#967</a>; <a href=\"https://app.notion.com/p/41a77dbba7888185b6e3c4241ae46f86\">Notion: UAT, Sidebar (MAPS-654)</a>; <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794908221495629\">Slack #maps, 17 Nov</a>", "shows": "Scroll-to-top and overlay scrollbar merged 11 Nov. He ran the sidebar UAT on 16 Nov (8 of 8 checks; the designers logged 1 medium and 3 low issues). The manager reviewed and approved #936 on 17 Nov after 28 days open; #992 followed the same day. Release v2026.11.17 lists #936, #992 and #990."}, {"ref": "E33", "source": "<a href=\"https://github.com/opengovsg/maps/pull/984\">PR #984</a>; <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794541233488679\">Slack #maps, 13 Nov</a>", "shows": "WebGL fallback (MAPS-645). He counted 204 sessions in 90 days blocked by a WebGL failure (self-reported). Manager approved with \"LGTM! thanks for this fix!\"; merged 13 Nov. Released 16 Nov in 5484264; map_display_failed first fired that evening (see E16)."}, {"ref": "E34", "source": "<a href=\"https://github.com/opengovsg/maps/pull/971\">PR #971</a>, <a href=\"https://github.com/opengovsg/maps/pull/990\">#990</a>, <a href=\"https://github.com/opengovsg/maps/pull/995\">#995</a>; <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794297896851679\">Slack #maps, 11 Nov</a>, <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794908221495629\">17 Nov</a>", "shows": "Contrast fix (MAPS-606) vetted by the designer, approved by the manager, merged 11 Nov. Keyboard-usable filter panels (MAPS-630, High) approved by the manager and merged 17 Nov, in release v2026.11.17. #995, a contrast follow-up, is open; he says the earlier contrast pass was not comprehensive."}, {"ref": "E35", "source": "<a href=\"https://github.com/opengovsg/maps/pull/907\">PR #907</a>; Linear MAPS-471; Notion journals 16\u201320 Nov; Notion: Enhanced Maps Ingestion hub", "shows": "He closed #907 on 16 Nov with the comment \"Stale draft\" (GitHub). MAPS-471 is still his and In Progress (since 2 Sep), last updated 18 Nov. The designer's updated flow arrived on 19 Nov; \"Build updated flow\" is open in his journal. The project hub 201313 Nov with his reasons (rare in practice, not worth a review cycle); with #978 that makes 6 closed this week. After a huddle on #980 the manager thanked him for the initiative. On 10 Nov the PM thanked him for fixing the super-admin view."}, {"ref": "E39", "source": "<a href=\"https://opengovproducts.enterprise.slack.com/archives/C0CHZS1STAS/p1794822375337579\">Slack #inc-1548, 16 Nov</a>, <a href=\"https://opengovproducts.enterprise.slack.com/archives/C0CHZS1STAS/p1794823958672729\">manager's thanks</a>, <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794832332635769\">post-mortem in #maps</a>; Datadog IR-1548; <a href=\"https://github.com/opengovsg/maps/pull/991\">PR #991</a>; <a href=\"https://app.notion.com/p/41a77dbba788816ea719f783107a8760\">Notion post-mortem</a>", "shows": "SEV-4. An officer's bulk role changes were refused about 35 times (34 in his PR, 35 in the post-mortem) because the members list was read from the replica just after a write. Datadog lists him as creator and commander: declared 17:24, resolved 18:13 SGT (48 minutes), 1 user affected, no customer impact. His fix #991 (12 lines) was approved by the manager and merged at 17:49. The officer was acting on a request Anselm had sent that afternoon to restrict some maps; the bug predates that. The manager and an engineer thanked him; a third thanks was shared three ways and is not counted."}, {"ref": "E40", "source": "<a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794902115930329\">Slack #maps, 17 Nov</a>, <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1795068406832769\">19 Nov</a>; Notion journal <a href=\"https://app.notion.com/p/41b77dbba78881bbb3f3c09181848b7a\">Tuesday 17 Nov</a>", "shows": "Before 15 days of leave, the manager wrote that he will work on Download markers and the ingestion tasks and is secondary on-call. An engineer gave him temporary write access to the infra repo for incidents. His journal records the 1:1: ingestion is P0, Download CSV is P1, and neither merges until the manager is back."}, {"ref": "E41", "source": "<a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794992209174159?thread_ts=1794992010.295229\">Slack #maps, 18 Nov</a>, <a href=\"https://opengovproducts.enterprise.slack.com/archives/C087HRWP18B/p1794995471116179\">MAPS-700 thread</a>; <a href=\"https://github.com/opengovsg/maps/pull/993\">PR #993</a>, <a href=\"https://github.com/opengovsg/maps/pull/996\">#996</a>", "shows": "The PM thanked him for drafting a support reply to an agency user. The same day he proposed a readable error table in place of raw JSON (MAPS-700); the designer agreed and #993 is open, with #996 (two Claude Code skills), both awaiting human review."}], "coverage": [{"source": "GitHub", "level": "ok", "status": "Complete", "note": "All PRs and reviews in opengovsg/maps. No org-wide OGP baseline: the search API cannot group by author at that scale."}, {"source": "Linear", "level": "ok", "status": "Complete", "note": "Assigned and created issues, team completions since 17 Aug."}, {"source": "Notion", "level": "ok", "status": "Mostly", "note": "123 authored pages, most of them daily journals. Creation dates were not readable; no team doc baseline. The generated Impact Dashboard page is not counted."}, {"source": "Slack", "level": "part", "status": "Public only", "note": "Public messages tallied by hand from search (about \u00b15). DMs not counted or quoted."}, {"source": "PostHog", "level": "ok", "status": "Production, from 31 Oct", "note": "Maps (production), project 189562, excluding team accounts. Earlier pulls used the dev project, 189206, and were withdrawn. Stacked-marker data covers 25 days; search picks 8 days. No events for the sidebar or keyboard filters."}, {"source": "Datadog", "level": "ok", "status": "Reconnected 20 Nov", "note": "First read since 23 Oct. Monitor 335569817 OK. Incidents 1458 (he spotted it; not his fix), 1479 (his role is recorded in Slack only) and 1548 (he is creator and commander) all resolved. Monitors were found by name search, so one of his without \"Maps\" in its name would be missed."}]}};
const C = V.content;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const refs = rs => (rs || []).map(r => `<a class="ref" href="#${r.toLowerCase()}">${r}</a>`).join("");
const fmt = (n, d = 0) => Number(n).toLocaleString("en-SG", {minimumFractionDigits: d, maximumFractionDigits: d});
const day = s => new Date(s + "T00:00:00+08:00");
const short = s => day(s).toLocaleDateString("en-SG", {day: "numeric", month: "short", timeZone: "Asia/Singapore"});

/* header */
$("asof").textContent = `Impact · as of ${day(V.as_of).toLocaleDateString("en-SG",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Singapore"})}`;
$("role").textContent = C.role;
{
  const s = day(V.start), e = day(C.end_date), n = day(V.as_of), f = (n - s) / (e - s);
  const svg = $("tenure"), x = 8 + f * 324;
  el("line", {x1: 8, x2: 332, y1: 20, y2: 20, stroke: "var(--rule)", "stroke-width": 6, "stroke-linecap": "round"}, svg);
  el("line", {x1: 8, x2: x, y1: 20, y2: 20, stroke: "var(--accent)", "stroke-width": 6, "stroke-linecap": "round"}, svg);
  el("circle", {cx: x, cy: 20, r: 7, fill: "var(--card)", stroke: "var(--accent)", "stroke-width": 3}, svg);
  const wk = Math.floor((n - s) / 6048e5) + 1, tot = Math.round((e - s) / 6048e5);
  $("tenurecap").innerHTML = `<span>${short(V.start)}</span><span style="color:var(--ink)">week ${wk} of ${tot}</span><span>${short(C.end_date)}</span>`;
}

/* stats: total, change since last snapshot, and per-week position against the team (band = p25–p75, tick = median) */
{
  const b = V.gh_baseline, L = V.linear, now = V.now, prev = V.prev;
  const delta = k => { if (!prev) return `<div class="d"></div>`; const x = now[k] - prev[k]; if (!x) return `<div class="d">no change</div>`;
    return `<div class="d ${x > 0 ? "up" : "down"}">${x > 0 ? "▲" : "▼"} ${fmt(Math.abs(x))} since ${short(V.prev_as_of)}</div>`; };
  const items = [
    {k: "PRs merged", v: now.merged, d: delta("merged"), q: b.merged_per_week, unit: "/wk", ref: "E1"},
    {k: "Linear issues done", v: now.linear_done, d: delta("linear_done"), q: {...L.baseline.completed_per_week, me: L.per_week, n: L.baseline.n_assignees}, unit: "/wk", ref: "E17"},
    {k: "Lines merged", v: now.lines, d: delta("lines"), q: b.lines_merged, unit: "", ref: "E1"},
    {k: "Teammate PRs reviewed", v: now.reviews, d: delta("reviews"), q: b.reviews_per_week, unit: "/wk", ref: "E1"},
    {k: "Issues caught before release", v: C.caught_before_release.value, d: `<div class="d">in 5 UAT and bug-bash docs</div>`, ref: C.caught_before_release.ref},
  ];
  for (const it of items) {
    const div = document.createElement("div"); div.className = "stat";
    div.innerHTML = `<div class="k">${it.k}${refs([it.ref])}</div><div class="v">${fmt(it.v)}</div>${it.d}`;
    if (it.q) {
      const q = it.q, max = Math.max(q.me, q.p75) * 1.12 || 1, X = v => 4 + (v / max) * 92;
      const svg = el("svg", {viewBox: "0 0 100 24", preserveAspectRatio: "none"}, div);
      el("line", {x1: 4, x2: 96, y1: 12, y2: 12, stroke: "var(--rule)", "stroke-width": 1.2, "vector-effect": "non-scaling-stroke"}, svg);
      el("rect", {x: X(q.p25), width: Math.max(X(q.p75) - X(q.p25), .8), y: 7, height: 10, fill: "var(--rule)"}, svg);
      el("line", {x1: X(q.median), x2: X(q.median), y1: 3, y2: 21, stroke: "var(--muted)", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke"}, svg);
      el("rect", {x: X(q.me) - 1.6, y: 6, width: 3.2, height: 12, rx: 1.6, fill: "var(--accent)"}, svg);
      const d = it.unit ? 2 : 0;
      div.insertAdjacentHTML("beforeend", `<div class="cmp"><span style="color:var(--accent)">you ${fmt(q.me, d)}${it.unit}</span> · team median ${fmt(q.median, d)} · n=${q.n}</div>`);
    }
    $("stats").appendChild(div);
  }
}

/* timeline: one lane per project, one dot per PR */
{
  const prs = V.prs, s = day(V.start), e = day(V.as_of);
  const first = {}; prs.forEach(p => { if (!(p.theme in first) || p.created < first[p.theme]) first[p.theme] = p.created; });
  const lanes = Object.keys(first).filter(t => t !== "Other").sort((a, b) => first[a] < first[b] ? -1 : 1);
  const W = 1000, L = 200, R = 16, H = 32, top = 8, svg = $("timeline");
  const h = top + lanes.length * H + 34; svg.setAttribute("viewBox", `0 0 ${W} ${h}`);
  const X = d => L + (day(d) - s) / (e - s) * (W - L - R);
  for (let m = new Date(s.getFullYear(), s.getMonth() + 1, 1); m <= e; m.setMonth(m.getMonth() + 1)) {
    const iso = m.toLocaleDateString("en-CA"), x = X(iso);
    el("line", {x1: x, x2: x, y1: top, y2: h - 26, stroke: "var(--rule)"}, svg);
    el("text", {x, y: h - 8, "text-anchor": "middle", "font-family": "IBM Plex Mono", "font-size": 13, fill: "var(--muted)"}, svg).textContent = m.toLocaleDateString("en-SG", {month: "short"});
  }
  lanes.forEach((t, i) => {
    const y = top + i * H + H / 2;
    el("text", {x: 0, y: y + 5, "font-family": "IBM Plex Sans", "font-size": 14, fill: "var(--ink)"}, svg).textContent = t;
    el("line", {x1: L, x2: W - R, y1: y, y2: y, stroke: "var(--rule)", "stroke-dasharray": "2 4"}, svg);
    prs.filter(p => p.theme === t).sort((a, b) => (b.additions + b.deletions) - (a.additions + a.deletions)).forEach(p => {
      const lines = (p.additions || 0) + (p.deletions || 0), r = Math.max(4, Math.min(13, Math.sqrt(lines) / 5.5));
      const st = p.merged ? "merged" : p.state === "open" ? "open" : "closed";
      const a = el("a", {href: p.url, target: "_blank"}, svg);
      const c = el("circle", {cx: X(p.merged || p.created), cy: y, r,
        fill: st === "merged" ? "var(--accent)" : "var(--card)", "fill-opacity": st === "merged" ? .8 : .9,
        stroke: st === "closed" ? "var(--faint)" : "var(--accent)", "stroke-width": st === "merged" ? 1 : 2}, a);
      if (st === "merged") c.setAttribute("stroke", "var(--card)");
      el("title", {}, c).textContent = `#${p.number} · ${st} · ${fmt(lines)} lines\n${p.title}`;
    });
  });
  const c = V.counts; $("prsum").textContent = `${c.merged} merged · ${c.open} open · ${c.closed} closed`;
}

/* projects */
$("projects").innerHTML = C.projects.map(p => `

    <div><div class="name">${esc(p.name)}<span class="key">${esc(p.key)}</span></div><div class="what">${esc(p.what)}</div>${p.caveat ? `<div class="cav">${esc(p.caveat)}</div>` : ""}</div>
    <div class="proof"><div class="p">${esc(p.proof)}</div><div class="s">${esc(p.proof_sub)}${refs(p.refs)}</div></div>
    <div class="prs">${p.prs.map(r => `<a href="${r.url}" target="_blank">#${r.n}</a>`).join("")}</div>
  </div>`).join("");

/* usage: weekly bars, launch marked */
{
  const show = {stacked_marker_group_opened: ["Stacked-marker group opens", "tracking from"], map_ownership_transferred: ["Ownership transfers", "launched"]};
  V.posthog.filter(f => show[f.event]).forEach(f => {
    const wk = f.weekly, total = wk.reduce((a, w) => a + w.count, 0);
    const div = document.createElement("div"); div.className = "chart";
    div.innerHTML = `<div class="t">${show[f.event][0]}${refs(["E16"])}</div><div class="u">${fmt(total)} outside the team · ${show[f.event][1]} ${short(f.launch_date)} · per week</div>`;
    const W = 460, H = 110, B = 18, max = Math.max(1, ...wk.map(w => w.count)), bw = W / wk.length;
    const svg = el("svg", {viewBox: `0 0 ${W} ${H + B}`}, div);
    wk.forEach((w, i) => {
      const bh = w.count / max * (H - 16), x = i * bw;
      if (w.count) el("rect", {x: x + 3, y: H - bh, width: bw - 6, height: Math.max(bh, 2), fill: "var(--accent)", rx: 1.5}, svg);
      if (w.count) el("text", {x: x + bw / 2, y: H - bh - 5, "text-anchor": "middle", "font-family": "IBM Plex Mono", "font-size": 12, fill: "var(--ink)"}, svg).textContent = fmt(w.count);
      if (w.week_starting <= f.launch_date && (!wk[i + 1] || wk[i + 1].week_starting > f.launch_date)) {
        el("line", {x1: x + 1, x2: x + 1, y1: 4, y2: H, stroke: "var(--warn)", "stroke-dasharray": "3 3"}, svg);
        el("text", {x: x - 5, y: H - 6, "text-anchor": "end", "font-family": "IBM Plex Mono", "font-size": 11, fill: "var(--warn)"}, svg).textContent = show[f.event][1].split(" ")[0];
      }
    });
    el("line", {x1: 0, x2: W, y1: H, y2: H, stroke: "var(--rule)"}, svg);
    el("text", {x: 0, y: H + 15, "font-family": "IBM Plex Mono", "font-size": 11, fill: "var(--muted)"}, svg).textContent = short(wk[0].week_starting);
    el("text", {x: W, y: H + 15, "text-anchor": "end", "font-family": "IBM Plex Mono", "font-size": 11, fill: "var(--muted)"}, svg).textContent = short(wk[wk.length - 1].week_starting);
    $("usage").appendChild(div);
  });
}

/* kudos, weak spots, next */
$("kudos").innerHTML = C.kudos.map(k => `<div class="kudo"><div class="m"><b>${esc(k.who)}</b>${esc(k.where)} · ${esc(k.date)}</div><div>${esc(k.said)}${refs([k.ref])}</div></div>`).join("");
$("weak").innerHTML = C.weak_spots.map(w => `<li>${esc(w.text)}${refs([w.ref])}</li>`).join("");
$("next").innerHTML = C.next.map(n => `<li class="${n.done ? "done" : ""}">${esc(n.text)}</li>`).join("");

/* sources: ledger html is hand-curated in content.json */
$("cov").innerHTML = C.coverage.map(c => `<div><b>${esc(c.source)}<span class="lvl ${c.level}">${esc(c.status)}</span></b>${c.note}</div>`).join("");
$("ledger").innerHTML = C.ledger.map(r => `<tr id="${r.ref.toLowerCase()}"><td>${r.ref}</td><td>${r.source}</td><td>${r.shows}</td></tr>`).join("");
const openSrc = () => { if (/^#e\d+$/.test(location.hash)) { $("sources").open = true; document.querySelector(location.hash)?.scrollIntoView({block: "center"}); } };
addEventListener("hashchange", openSrc); openSrc();
$("foot").textContent = "Comparisons are Maps-team aggregates per week of tenure, never named colleagues. Self-reported figures are labelled. Updated every Friday.";
</script>
